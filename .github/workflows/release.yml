name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      package_dir:
        description: "Package directory to republish"
        required: true
        type: string
      version:
        description: "Package version to republish"
        required: true
        type: string
      release_ref:
        description: "Git ref containing the package version"
        required: true
        default: main
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Validate the released revision once. Publish jobs only verify their own
  # tarball and already-published workspace dependency ranges.
  release-verify:
    needs: release-please
    if: ${{ github.event_name == 'push' && needs.release-please.outputs.paths_released }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run repository gate
        run: npm run check

  # Wave 1: the side-effect-free config foundation has no workspace dependency.
  publish-config:
    needs: [release-please, release-verify]
    if: ${{ always() && github.event_name == 'push' && contains(needs.release-please.outputs.paths_released, 'packages/pi-extensions-config') && needs.release-verify.result == 'success' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm for OIDC support
        run: |
          corepack enable npm
          corepack prepare npm@latest --activate
          npm --version

      - name: Verify tarball
        working-directory: packages/pi-extensions-config
        run: npm pack --dry-run --json --ignore-scripts > /dev/null

      - name: Publish to npm
        working-directory: packages/pi-extensions-config
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" =~ -[a-zA-Z] ]]; then
            npm publish --provenance --tag beta
          else
            npm publish --provenance
          fi

  # Wave 2: the locale/notice foundation uses the config library.
  publish-i18n:
    needs: [release-please, release-verify, publish-config]
    if: ${{ always() && github.event_name == 'push' && contains(needs.release-please.outputs.paths_released, 'packages/pi-extensions-i18n') && needs.release-verify.result == 'success' && (needs.publish-config.result == 'success' || needs.publish-config.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm for OIDC support
        run: |
          corepack enable npm
          corepack prepare npm@latest --activate
          npm --version

      - name: Verify published workspace dependencies
        run: node scripts/verify-published-workspace-deps.mjs packages/pi-extensions-i18n

      - name: Verify tarball
        working-directory: packages/pi-extensions-i18n
        run: npm pack --dry-run --json --ignore-scripts > /dev/null

      - name: Publish to npm
        working-directory: packages/pi-extensions-i18n
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" =~ -[a-zA-Z] ]]; then
            npm publish --provenance --tag beta
          else
            npm publish --provenance
          fi

  # Wave 3a: feature packages whose workspace foundations are now available.
  publish-independent:
    needs: [release-please, release-verify, publish-i18n]
    if: ${{ always() && github.event_name == 'push' && needs.release-please.outputs.paths_released && needs.release-verify.result == 'success' && (needs.publish-i18n.result == 'success' || needs.publish-i18n.result == 'skipped') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: packages/pi-web-search
          - dir: packages/pi-distill
          - dir: packages/pi-models-discovery
          - dir: packages/pi-blackhole
          - dir: packages/pi-context-view
          - dir: packages/pi-rewind
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm for OIDC support
        run: |
          corepack enable npm
          corepack prepare npm@latest --activate
          npm --version

      - name: Verify published workspace dependencies
        if: ${{ contains(needs.release-please.outputs.paths_released, matrix.dir) }}
        run: node scripts/verify-published-workspace-deps.mjs "${{ matrix.dir }}"

      - name: Verify tarball
        if: ${{ contains(needs.release-please.outputs.paths_released, matrix.dir) }}
        working-directory: ${{ matrix.dir }}
        run: npm pack --dry-run --json --ignore-scripts > /dev/null

      - name: Publish to npm
        if: ${{ contains(needs.release-please.outputs.paths_released, matrix.dir) }}
        working-directory: ${{ matrix.dir }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" =~ -[a-zA-Z] ]]; then
            npm publish --provenance --tag beta
          else
            npm publish --provenance
          fi

  # Wave 3b: terminal-mux waits for i18n, then unlocks its consumers.
  publish-terminal-mux:
    needs: [release-please, release-verify, publish-i18n]
    if: ${{ always() && github.event_name == 'push' && contains(needs.release-please.outputs.paths_released, 'packages/pi-terminal-mux') && needs.release-verify.result == 'success' && (needs.publish-i18n.result == 'success' || needs.publish-i18n.result == 'skipped') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm for OIDC support
        run: |
          corepack enable npm
          corepack prepare npm@latest --activate
          npm --version

      - name: Verify published workspace dependencies
        run: node scripts/verify-published-workspace-deps.mjs packages/pi-terminal-mux

      - name: Verify tarball
        working-directory: packages/pi-terminal-mux
        run: npm pack --dry-run --json --ignore-scripts > /dev/null

      - name: Publish to npm
        working-directory: packages/pi-terminal-mux
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" =~ -[a-zA-Z] ]]; then
            npm publish --provenance --tag beta
          else
            npm publish --provenance
          fi

  # Wave 4: both packages import terminal-mux at runtime.
  publish-terminal-consumers:
    needs: [release-please, release-verify, publish-i18n, publish-terminal-mux]
    if: ${{ always() && github.event_name == 'push' && needs.release-please.outputs.paths_released && needs.release-verify.result == 'success' && (needs.publish-i18n.result == 'success' || needs.publish-i18n.result == 'skipped') && (needs.publish-terminal-mux.result == 'success' || needs.publish-terminal-mux.result == 'skipped') }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: packages/pi-spark
          - dir: packages/pi-interactive-subagents
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'

      - name: Update npm for OIDC support
        run: |
          corepack enable npm
          corepack prepare npm@latest --activate
          npm --version

      - name: Verify published workspace dependencies
        if: ${{ contains(needs.release-please.outputs.paths_released, matrix.dir) }}
        run: node scripts/verify-published-workspace-deps.mjs "${{ matrix.dir }}"

      - name: Verify tarball
        if: ${{ contains(needs.release-please.outputs.paths_released, matrix.dir) }}
        working-directory: ${{ matrix.dir }}
        run: npm pack --dry-run --json --ignore-scripts > /dev/null

      - name: Publish to npm
        if: ${{ contains(needs.release-please.outputs.paths_released, matrix.dir) }}
        working-directory: ${{ matrix.dir }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" =~ -[a-zA-Z] ]]; then
            npm publish --provenance --tag beta
          else
            npm publish --provenance
          fi

  # Manual recovery for a GitHub Release whose npm publication failed.
  publish-npm-retry:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Update npm for OIDC support
        run: |
          corepack enable npm
          corepack prepare npm@latest --activate
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run repository gate
        run: npm run check

      - name: Verify package version
        working-directory: ${{ inputs.package_dir }}
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          ACTUAL_VERSION=$(node -p "require('./package.json').version")
          test "$ACTUAL_VERSION" = "$EXPECTED_VERSION"

      - name: Verify published workspace dependencies
        run: node scripts/verify-published-workspace-deps.mjs "${{ inputs.package_dir }}"

      - name: Verify tarball
        working-directory: ${{ inputs.package_dir }}
        run: npm pack --dry-run --json --ignore-scripts > /dev/null

      - name: Publish to npm
        working-directory: ${{ inputs.package_dir }}
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" =~ -[a-zA-Z] ]]; then
            npm publish --provenance --tag beta
          else
            npm publish --provenance
          fi
