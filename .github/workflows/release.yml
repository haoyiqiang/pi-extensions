name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      package_dir:
        description: "Package directory to republish"
        required: true
        type: string
      version:
        description: "Package version to republish"
        required: true
        type: string
      release_ref:
        description: "Git ref containing the package version"
        required: true
        default: main
        type: string

permissions:
  contents: write
  pull-requests: write
  id-token: write

jobs:
  release-please:
    if: ${{ github.event_name == 'push' }}
    runs-on: ubuntu-latest
    outputs:
      paths_released: ${{ steps.release.outputs.paths_released }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  # Validate the released revision once. Publish jobs only verify their own
  # tarball and already-published workspace dependency ranges.
  release-verify:
    needs: release-please
    if: ${{ github.event_name == 'push' && needs.release-please.outputs.paths_released }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          registry-url: 'https://registry.npmjs.org'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Run repository gate
        run: npm run check

  # Wave 1: the shared config/locale/test foundation has no workspace dependency.
  publish-pi-utils:
    needs: [release-please, release-verify]
    if: ${{ always() && github.event_name == 'push' && contains(needs.release-please.outputs.paths_released, 'packages/pi-utils') && needs.release-verify.result == 'success' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update npm for OIDC support
        run: |
          npm install -g npm@11.20.0
          which npm
          npm --version

      - name: Verify tarball
        working-directory: packages/pi-utils
        run: npm pack --dry-run --json --ignore-scripts > /dev/null

      - name: Publish to npm
        working-directory: packages/pi-utils
        run: |
          # npm@latest (12.2) skipped OIDC and returned ENEEDAUTH. Pin 11.20,
          # which exchanges a GitHub ID token for an npm publish token.
          # Do not set NODE_AUTH_TOKEN: a dummy token makes npm skip OIDC.
          echo "npm $(npm --version) at $(which npm)"
          echo "OIDC token URL present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
            sed -i '/^always-auth/d' "$npmrc"
          fi
          unset NODE_AUTH_TOKEN
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" =~ -[a-zA-Z] ]]; then
            npm publish --access public --provenance --tag beta
          else
            npm publish --access public --provenance
          fi

  # Wave 2: feature packages whose shared foundation is now available.
  publish-independent:
    needs: [release-please, release-verify, publish-pi-utils]
    if: ${{ always() && github.event_name == 'push' && needs.release-please.outputs.paths_released && needs.release-verify.result == 'success' && (needs.publish-pi-utils.result == 'success' || needs.publish-pi-utils.result == 'skipped') }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - dir: packages/pi-web-search
          - dir: packages/pi-spark
          - dir: packages/pi-subagent
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Update npm for OIDC support
        run: |
          npm install -g npm@11.20.0
          which npm
          npm --version

      - name: Verify published workspace dependencies
        if: ${{ contains(needs.release-please.outputs.paths_released, matrix.dir) }}
        run: node scripts/verify-published-workspace-deps.mjs "${{ matrix.dir }}"

      - name: Verify tarball
        if: ${{ contains(needs.release-please.outputs.paths_released, matrix.dir) }}
        working-directory: ${{ matrix.dir }}
        run: npm pack --dry-run --json --ignore-scripts > /dev/null

      - name: Publish to npm
        if: ${{ contains(needs.release-please.outputs.paths_released, matrix.dir) }}
        working-directory: ${{ matrix.dir }}
        run: |
          echo "npm $(npm --version) at $(which npm)"
          echo "OIDC token URL present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
            sed -i '/^always-auth/d' "$npmrc"
          fi
          unset NODE_AUTH_TOKEN
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" =~ -[a-zA-Z] ]]; then
            npm publish --access public --provenance --tag beta
          else
            npm publish --access public --provenance
          fi

  # Manual recovery for a GitHub Release whose npm publication failed.
  publish-npm-retry:
    if: ${{ github.event_name == 'workflow_dispatch' }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_ref }}

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Update npm for OIDC support
        run: |
          npm install -g npm@11.20.0
          which npm
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Run repository gate
        run: npm run check

      - name: Verify package is release-managed and public
        env:
          PACKAGE_DIR: ${{ inputs.package_dir }}
        run: |
          node --input-type=module <<'NODE'
          import { readFileSync } from "node:fs";
          const packageDirectory = process.env.PACKAGE_DIR;
          const releaseConfig = JSON.parse(readFileSync("release-please-config.json", "utf8"));
          if (!Object.hasOwn(releaseConfig.packages ?? {}, packageDirectory)) {
            throw new Error(`Package is not release-managed: ${packageDirectory}`);
          }
          const manifest = JSON.parse(readFileSync(`${packageDirectory}/package.json`, "utf8"));
          if (manifest.private === true) throw new Error(`Refusing to publish private package: ${manifest.name}`);
          NODE

      - name: Verify package version
        working-directory: ${{ inputs.package_dir }}
        env:
          EXPECTED_VERSION: ${{ inputs.version }}
        run: |
          ACTUAL_VERSION=$(node -p "require('./package.json').version")
          test "$ACTUAL_VERSION" = "$EXPECTED_VERSION"

      - name: Verify published workspace dependencies
        run: node scripts/verify-published-workspace-deps.mjs "${{ inputs.package_dir }}"

      - name: Verify tarball
        working-directory: ${{ inputs.package_dir }}
        run: npm pack --dry-run --json --ignore-scripts > /dev/null

      - name: Publish to npm
        working-directory: ${{ inputs.package_dir }}
        run: |
          echo "npm $(npm --version) at $(which npm)"
          echo "OIDC token URL present: ${ACTIONS_ID_TOKEN_REQUEST_URL:+yes}"
          npmrc="${NPM_CONFIG_USERCONFIG:-$HOME/.npmrc}"
          if [ -f "$npmrc" ]; then
            sed -i '/_authToken/d' "$npmrc"
            sed -i '/^always-auth/d' "$npmrc"
          fi
          unset NODE_AUTH_TOKEN
          VERSION=$(node -p "require('./package.json').version")
          if [[ "$VERSION" =~ -[a-zA-Z] ]]; then
            npm publish --access public --provenance --tag beta --loglevel verbose
          else
            npm publish --access public --provenance --loglevel verbose
          fi
